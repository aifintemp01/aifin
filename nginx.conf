# ============================================================
# AIFIN — nginx config
# Serves the built React frontend as static files, and reverse
# proxies the known FastAPI backend route prefixes to :8000.
#
# The backend has NO shared /api prefix — its routers are mounted
# directly on root (see app/backend/routes/__init__.py and
# app/backend/routes/pageindex.py), so each prefix is listed below
# explicitly. If a new router is added with a new prefix, add a
# matching location block here.
# ============================================================

server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # ── Backend route prefixes — proxy to FastAPI on :8000 ──────
    location ~ ^/(health|hedge-fund|storage|flows|ollama|language-models|api-keys|pdf|pageindex)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Required for SSE (Server-Sent Events) streaming
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;   # Long timeout for SSE streams and OCR/PDF work
        proxy_send_timeout 600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend's own interactive docs (FastAPI default) — optional but handy
    location /docs {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # ── Frontend — static files built by the frontend-builder stage ─
    root /opt/ai-hedge-fund/app/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache built static assets aggressively (Vite fingerprints filenames)
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

